[project]
name = "prune-lab"
version = "0.1.0"
description = "Take a ~4B LLM, find what it uses for one narrow task, structurally prune it hard, then fully train the small model on that task."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11.0",
    "transformers>=5.22",
    "accelerate>=1.10",
    "datasets>=4.0",
    "safetensors>=0.6",
    "numpy>=2.0",
    "pyarrow>=20",
    "bitsandbytes>=0.50.2",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prunelab"]

[dependency-groups]
dev = [
    "pytest>=8",
]
